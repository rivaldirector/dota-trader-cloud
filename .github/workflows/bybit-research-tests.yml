name: Bybit research tests

on:
  push:
    branches:
      - feature/bybit-public-signals
    paths:
      - "trading/**"
      - "tests/test_bybit_*.py"
      - ".github/workflows/bybit-research-tests.yml"
  pull_request:
    paths:
      - "trading/**"
      - "tests/test_bybit_*.py"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependency
        run: python -m pip install requests
      - name: Run Bybit research tests
        run: python -m unittest tests.test_bybit_signal_engine tests.test_bybit_backtest -v
